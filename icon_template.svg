  这是一个SVG图标模板文件
  请将此文件复制并重命名为对应的图标名称
  
  使用方法：
  1. 复制此文件
  2. 重命名为需要的图标名称（如 ic_home.svg）
  3. 修改path内容为实际图标路径
-->

<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 示例：圆形图标 -->
  <circle cx="12" cy="12" r="10" fill="#1677FF"/>
